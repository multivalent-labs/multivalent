[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multivalent"
version = "0.0.1"
description = "Multivalent AI infrastructure SDK — verifiable reinforcement learning environments and post-training verification for biology."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    { name = "Multivalent Labs", email = "oss@multivalent.ai" }
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://multivalent.ai"
Documentation = "https://multivalent.dev"
